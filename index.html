<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Weather</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      color: #fff;
      --accent: #42a5f5;
      --glow:   rgba(66,165,245,0.45);
      background: linear-gradient(160deg, #0d1b2a 0%, #1a2a3a 100%);
      transition: background 3s ease, --accent 3s;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Sky backgrounds ── */
    body[data-wx="clear"][data-day="1"] {
      background: linear-gradient(160deg, #0a3d91 0%, #1565c0 35%, #42a0e8 70%, #aad4f0 100%);
      --accent: #ffd740; --glow: rgba(255,215,64,0.6);
    }
    body[data-wx="clear"][data-day="0"] {
      background: linear-gradient(160deg, #010208 0%, #030a20 60%, #04102a 100%);
      --accent: #ccd4ff; --glow: rgba(200,210,255,0.45);
    }
    body[data-wx="partly-cloudy"][data-day="1"] {
      background: linear-gradient(160deg, #0d3b7a 0%, #1e62b0 45%, #5090c8 80%, #90c0da 100%);
      --accent: #ffca28; --glow: rgba(255,202,40,0.5);
    }
    body[data-wx="partly-cloudy"][data-day="0"] {
      background: linear-gradient(160deg, #060c1a 0%, #0c1830 60%, #121e3c 100%);
      --accent: #90a8d8; --glow: rgba(144,168,216,0.4);
    }
    body[data-wx="overcast"] {
      background: linear-gradient(160deg, #181e2a 0%, #222b38 50%, #2e3848 100%);
      --accent: #90a4ae; --glow: rgba(144,164,174,0.35);
    }
    body[data-wx="fog"] {
      background: linear-gradient(160deg, #26303c 0%, #36424e 50%, #4e5a66 100%);
      --accent: #b0bec5; --glow: rgba(176,190,197,0.35);
    }
    body[data-wx="drizzle"] {
      background: linear-gradient(160deg, #0c1620 0%, #121e2c 50%, #182838 100%);
      --accent: #81d4fa; --glow: rgba(129,212,250,0.4);
    }
    body[data-wx="rain"], body[data-wx="showers"] {
      background: linear-gradient(160deg, #05080f 0%, #090e1a 50%, #0e1520 100%);
      --accent: #42a5f5; --glow: rgba(66,165,245,0.45);
    }
    body[data-wx="snow"] {
      background: linear-gradient(160deg, #18202e 0%, #22303e 50%, #2c3848 100%);
      --accent: #e3f2fd; --glow: rgba(227,242,253,0.5);
    }
    body[data-wx="storm"] {
      background: linear-gradient(160deg, #020408 0%, #060a10 50%, #080f18 100%);
      --accent: #7e57c2; --glow: rgba(126,87,194,0.6);
    }

    /* ── Particles ── */
    #particles {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 1; overflow: hidden;
    }
    .rain-drop {
      position: absolute; top: -30px; width: 1.5px;
      background: linear-gradient(to bottom, transparent, rgba(180,220,255,0.55));
      border-radius: 1px;
      animation: rain-fall linear infinite;
      transform: rotate(-12deg);
    }
    @keyframes rain-fall { to { transform: rotate(-12deg) translateY(110vh); } }

    .snow-flake {
      position: absolute; top: -30px;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 0 4px rgba(255,255,255,0.4);
      animation: snow-fall linear infinite;
    }
    @keyframes snow-fall { to { transform: translateY(110vh) rotate(720deg); } }

    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.1; transform: scale(0.7); }
      to   { opacity: 1;   transform: scale(1.3); }
    }
    .fog-band {
      position: absolute; left: -10%; right: -10%;
      background: linear-gradient(to right, transparent, rgba(200,210,222,0.12), transparent);
      filter: blur(10px);
      animation: fog-drift ease-in-out infinite alternate;
    }
    @keyframes fog-drift {
      from { transform: translateX(-18px); }
      to   { transform: translateX( 18px); }
    }
    .lightning-flash {
      position: fixed; inset: 0; background: #fff;
      pointer-events: none;
      animation: lightning 7s ease infinite;
    }
    @keyframes lightning {
      0%,84%,87%,89%,100% { opacity: 0; }
      85%,88%              { opacity: 0.09; }
    }

    /* ── Sky stage: sun / moon / clouds ── */
    #sky-stage { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }

    .sun-wrap {
      position: absolute; top: -54px; right: -46px; width: 190px; height: 190px;
      opacity: 0; transition: opacity 2.5s;
    }
    body[data-wx="clear"][data-day="1"] .sun-wrap,
    body[data-wx="partly-cloudy"][data-day="1"] .sun-wrap { opacity: 1; }
    body[data-wx="partly-cloudy"][data-day="1"] .sun-wrap { opacity: 0.55; }
    .sun-core {
      position: absolute; inset: 32%; border-radius: 50%;
      background: radial-gradient(circle, #fffcf0 0%, #ffe066 40%, #ffb300 75%, transparent 100%);
      box-shadow: 0 0 46px 18px rgba(255,200,50,0.42), 0 0 90px 40px rgba(255,170,40,0.18);
      animation: sun-pulse 6s ease-in-out infinite;
    }
    @keyframes sun-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    .sun-rays { position: absolute; inset: 0; animation: sun-rotate 90s linear infinite; }
    .ray {
      position: absolute; left: 50%; top: 50%; width: 3px; height: 48%;
      background: linear-gradient(to top, transparent, rgba(255,214,90,0.42));
      transform-origin: bottom center;
    }
    @keyframes sun-rotate { to { transform: rotate(360deg); } }

    .moon-wrap {
      position: absolute; top: -38px; right: -30px; width: 116px; height: 116px;
      opacity: 0; transition: opacity 2.5s;
      filter: drop-shadow(0 0 30px rgba(210,222,255,0.4)) drop-shadow(0 0 56px rgba(190,205,255,0.2));
      animation: moon-breathe 8s ease-in-out infinite;
    }
    body[data-wx="clear"][data-day="0"] .moon-wrap,
    body[data-wx="partly-cloudy"][data-day="0"] .moon-wrap { opacity: 1; }
    body[data-wx="partly-cloudy"][data-day="0"] .moon-wrap { opacity: 0.5; }
    @keyframes moon-breathe { 0%,100% { filter: drop-shadow(0 0 30px rgba(210,222,255,0.4)) drop-shadow(0 0 56px rgba(190,205,255,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(210,222,255,0.55)) drop-shadow(0 0 70px rgba(190,205,255,0.28)); } }

    @media (max-width: 420px) {
      .sun-wrap  { width: 140px; height: 140px; top: -40px; right: -36px; }
      .moon-wrap { width: 90px;  height: 90px;  top: -28px; right: -24px; }
    }

    .cloud {
      position: absolute; background: rgba(255,255,255,0.85); border-radius: 50px;
      filter: blur(0.4px);
    }
    .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
    .cloud::before { width: 55%; height: 140%; top: -70%; left: 12%; }
    .cloud::after  { width: 42%; height: 110%; top: -50%; right: 15%; }
    @keyframes cloud-drift { from { transform: translateX(-24vw); } to { transform: translateX(124vw); } }

    .bolt-flash {
      position: absolute; z-index: 2; pointer-events: none;
      animation: lightning 7s ease infinite;
      filter: drop-shadow(0 0 14px rgba(255,255,255,0.9));
    }

    .wind-line {
      position: absolute; height: 1.5px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
      animation: wind-blow linear infinite;
    }
    @keyframes wind-blow {
      from { transform: translateX(-15vw); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.6; }
      to   { transform: translateX(115vw); opacity: 0; }
    }

    /* ── Ghost emoji ── */
    #wx-ghost {
      position: fixed; bottom: -4%; right: -2%;
      font-size: clamp(180px, 32vw, 380px);
      line-height: 1;
      opacity: 0.04;
      pointer-events: none; user-select: none;
      z-index: 1;
      filter: blur(3px);
      animation: ghost-sway 10s ease-in-out infinite;
      transition: opacity 3s;
    }
    @keyframes ghost-sway {
      0%,100% { transform: rotate(-4deg) translateY(0); }
      50%     { transform: rotate( 4deg) translateY(-15px); }
    }

    /* ── Page ── */
    .page {
      position: relative; z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: max(3rem, calc(env(safe-area-inset-top) + 1.5rem))
               max(1.5rem, env(safe-area-inset-right))
               max(2.5rem, calc(env(safe-area-inset-bottom) + 1rem))
               max(1.5rem, env(safe-area-inset-left));
      gap: 0;
    }

    .p-location {
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.25em;
      color: rgba(255,255,255,0.3);
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
      margin-bottom: 0.3rem;
    }
    #clock {
      font-size: 0.72rem; color: rgba(255,255,255,0.18);
      letter-spacing: 0.08em; font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
      margin-bottom: 2.5rem;
    }

    /* ── Hero ── */
    .p-hero {
      display: flex; align-items: center; justify-content: center;
      gap: 2rem; margin-bottom: 1rem;
    }
    .wx-icon {
      font-size: 108px; line-height: 1; user-select: none;
      filter: drop-shadow(0 0 22px var(--glow)) drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      animation: float 4s ease-in-out infinite;
      transition: filter 3s;
    }
    body[data-wx="storm"] .wx-icon { animation: wx-shake 0.2s ease-in-out infinite alternate; }
    body[data-wx="rain"] .wx-icon, body[data-wx="showers"] .wx-icon { animation: float 2.8s ease-in-out infinite; }
    @keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    @keyframes wx-shake { from{transform:rotate(-2deg)} to{transform:rotate(2deg)} }

    .p-temp-wrap { display: flex; align-items: flex-start; line-height: 1; }
    .p-temp {
      font-size: clamp(5rem, 14vw, 8.5rem);
      font-weight: 800; letter-spacing: -4px;
      color: var(--accent);
      text-shadow: 0 0 60px var(--glow);
      font-variant-numeric: tabular-nums;
      transition: color 3s, text-shadow 3s;
    }
    .p-unit {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 300; color: rgba(255,255,255,0.28);
      margin-top: 0.7rem; padding-left: 0.05em;
    }

    .p-condition {
      font-size: 1.1rem; color: rgba(255,255,255,0.6);
      margin-bottom: 0.3rem; text-align: center;
    }
    .p-feels {
      font-size: 0.8rem; color: rgba(255,255,255,0.28);
      margin-bottom: 3rem;
    }

    /* ── Stats: asymmetric grid ── */
    .p-stats {
      display: grid;
      grid-template-columns: 1fr 1.65fr 1fr;
      grid-template-rows: 1fr auto;
      gap: 1rem;
      width: 100%; max-width: 680px;
      align-items: stretch;
    }

    /* Shared tile base */
    .tile {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      transition: background 2.5s;
    }
    .tile-label {
      font-size: 0.62rem; text-transform: uppercase;
      letter-spacing: 0.14em; color: rgba(255,255,255,0.22);
    }
    .tile-value {
      font-size: 1.55rem; font-weight: 700;
      color: var(--accent); font-variant-numeric: tabular-nums;
      line-height: 1.15;
      transition: color 3s;
    }
    .tile-sub { font-size: 0.72rem; color: rgba(255,255,255,0.25); }

    /* Humidity — circle (col 1, row 1) */
    .t-hum {
      grid-column: 1; grid-row: 1;
      border-radius: 50%;
      aspect-ratio: 1;
      padding: 0;
      position: relative;
      overflow: hidden;
    }
    .ring-svg { display: block; width: 100%; height: auto; }
    .ring-track { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 5; }
    .ring-fill  {
      fill: none; stroke: var(--accent); stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 0 264;
      transform: rotate(-90deg); transform-origin: 50% 50%;
      transition: stroke-dasharray 1s ease, stroke 3s;
    }
    .ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
    }
    .ring-center .tile-value { font-size: 1.8rem; }
    .ring-center .tile-sub   { margin-top: -2px; }
    .ring-center .tile-label { margin-top: 3px; }

    /* Wind — tall pill (col 2, rows 1–2) */
    .t-wind {
      grid-column: 2; grid-row: 1 / 3;
      border-radius: 44px;
      padding: 1.6rem 1.2rem;
      gap: 0.6rem;
    }
    .t-wind .tile-label { font-size: 0.65rem; }
    .t-wind .tile-value { font-size: 1.4rem; }

    .compass-svg { display: block; width: min(120px, 60vw); height: auto; }
    .compass-ring  { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 1.5; }
    .compass-tick  { stroke: rgba(255,255,255,0.12); stroke-width: 1; stroke-linecap: round; }
    .compass-label { fill: rgba(255,255,255,0.22); font-size: 8px; font-family: system-ui; }
    .compass-dot   { fill: rgba(255,255,255,0.18); }
    #compass-north { fill: var(--accent); opacity: 0.95; transition: fill 3s; }
    #compass-south { fill: rgba(255,255,255,0.12); }

    /* UV — circle (col 3, row 1) */
    .t-uv {
      grid-column: 3; grid-row: 1;
      border-radius: 50%;
      aspect-ratio: 1;
      padding: 0.8rem;
      gap: 0.2rem;
    }
    .t-uv .tile-value { font-size: 2rem; }

    /* Pressure pill (col 1, row 2) */
    .t-pres {
      grid-column: 1; grid-row: 2;
      border-radius: 30px;
      padding: 1rem 0.8rem;
      gap: 0.2rem;
    }

    /* Rain pill (col 3, row 2) */
    .t-rain {
      grid-column: 3; grid-row: 2;
      border-radius: 30px;
      padding: 1rem 0.8rem;
      gap: 0.2rem;
    }

    /* ── Footer ── */
    .p-footer {
      margin-top: 2.5rem;
      font-size: 0.62rem; color: rgba(255,255,255,0.1);
      letter-spacing: 0.06em; text-align: center;
    }

    @media (max-width: 500px) {
      /* Top section */
      .p-hero  { gap: 1rem; }
      .wx-icon { font-size: 72px; }
      #clock   { margin-bottom: 1.5rem; }
      .p-feels { margin-bottom: 1.8rem; }
      .p-footer { margin-top: 1.2rem; }

      /* 2-column grid: wind spans full width on top,
         then hum|uv, then pres|rain                   */
      .p-stats {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto auto;
        gap: 0.65rem;
      }

      /* Wind — full-width pill, horizontal layout */
      .t-wind {
        grid-column: 1 / -1;
        grid-row: 1;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
        border-radius: 24px;
        padding: 1rem 1.5rem;
        gap: 1.2rem;
      }
      .t-wind .tile-label { font-size: 0.62rem; }
      .t-wind .tile-value { font-size: 1.05rem; white-space: nowrap; }

      /* Humidity circle — col 1, row 2 */
      .t-hum { grid-column: 1; grid-row: 2; }

      /* UV circle — col 2, row 2 */
      .t-uv  {
        grid-column: 2; grid-row: 2;
        border-radius: 50%;
        aspect-ratio: 1;
        padding: 0;
      }
      .t-uv .tile-value { font-size: 1.8rem; }

      /* Pressure pill — col 1, row 3 */
      .t-pres { grid-column: 1; grid-row: 3; border-radius: 24px; }

      /* Rain pill — col 2, row 3 */
      .t-rain { grid-column: 2; grid-row: 3; border-radius: 24px; }

      /* Shrink compass to fit inside horizontal wind tile */
      .compass-svg { width: 80px; }
    }
  </style>
</head>
<body>

<div id="sky-stage" aria-hidden="true">
  <div class="sun-wrap" id="sunWrap">
    <div class="sun-core"></div>
    <div class="sun-rays" id="sunRays"></div>
  </div>
  <div class="moon-wrap" id="moonWrap">
    <svg viewBox="0 0 150 150" width="100%" height="100%">
      <defs>
        <radialGradient id="moonGrad" cx="38%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#fdfdff"/>
          <stop offset="60%" stop-color="#dfe4f0"/>
          <stop offset="100%" stop-color="#b8bfd4"/>
        </radialGradient>
      </defs>
      <circle cx="75" cy="75" r="62" fill="url(#moonGrad)"/>
      <circle cx="55" cy="52" r="9"  fill="#c7cce0" opacity="0.55"/>
      <circle cx="92" cy="68" r="13" fill="#c7cce0" opacity="0.45"/>
      <circle cx="62" cy="95" r="7"  fill="#c7cce0" opacity="0.5"/>
      <circle cx="95" cy="100" r="5" fill="#c7cce0" opacity="0.4"/>
    </svg>
  </div>
  <div id="clouds"></div>
  <svg class="bolt-flash" id="boltFlash" width="60" height="140" viewBox="0 0 60 140" style="display:none">
    <polygon points="30,0 8,68 26,68 14,140 54,56 32,56 44,0" fill="#fff9de"/>
  </svg>
  <div id="windLines"></div>
</div>
<div id="wx-ghost" aria-hidden="true">🌡️</div>
<div id="particles" aria-hidden="true"></div>

<div class="page">
  <div class="p-location" id="location">—</div>
  <div id="clock"></div>

  <div class="p-hero">
    <div class="wx-icon" id="wx-icon">🌡️</div>
    <div class="p-temp-wrap">
      <span class="p-temp" id="temp">—</span>
      <span class="p-unit">°C</span>
    </div>
  </div>

  <div class="p-condition" id="condition">Loading…</div>
  <div class="p-feels" id="feels"></div>

  <div class="p-stats">

    <!-- Humidity circle with SVG progress ring -->
    <div class="tile t-hum">
      <svg class="ring-svg" viewBox="0 0 100 100">
        <circle class="ring-track" cx="50" cy="50" r="42"/>
        <circle class="ring-fill" id="hum-ring" cx="50" cy="50" r="42"/>
      </svg>
      <div class="ring-center">
        <div class="tile-value" id="humidity">—</div>
        <div class="tile-sub">%</div>
        <div class="tile-label">Humidity</div>
      </div>
    </div>

    <!-- Wind — tall, compass prominent -->
    <div class="tile t-wind">
      <div class="tile-label">Wind</div>
      <div class="tile-value" id="wind-speed">—</div>

      <svg class="compass-svg" id="compass" viewBox="0 0 120 120">
        <!-- Outer ring -->
        <circle class="compass-ring" cx="60" cy="60" r="54"/>
        <!-- 8 tick marks -->
        <line class="compass-tick" x1="60" y1="8"  x2="60" y2="16"/>
        <line class="compass-tick" x1="60" y1="104" x2="60" y2="112"/>
        <line class="compass-tick" x1="8"  y1="60" x2="16" y2="60"/>
        <line class="compass-tick" x1="104" y1="60" x2="112" y2="60"/>
        <line class="compass-tick" x1="21" y1="21" x2="27" y2="27" opacity="0.6"/>
        <line class="compass-tick" x1="93" y1="21" x2="99" y2="27" opacity="0.6"/>
        <line class="compass-tick" x1="21" y1="99" x2="27" y2="93" opacity="0.6"/>
        <line class="compass-tick" x1="93" y1="99" x2="99" y2="93" opacity="0.6"/>
        <!-- Cardinal labels -->
        <text class="compass-label" x="60" y="7"  text-anchor="middle" dy="0.3em">N</text>
        <text class="compass-label" x="60" y="116" text-anchor="middle" dy="0.3em">S</text>
        <text class="compass-label" x="6"  y="60"  text-anchor="middle" dy="0.35em">W</text>
        <text class="compass-label" x="114" y="60" text-anchor="middle" dy="0.35em">E</text>
        <!-- Needle -->
        <g id="compass-needle" transform="rotate(0,60,60)">
          <polygon id="compass-north" points="60,14 57,60 60,54 63,60"/>
          <polygon id="compass-south" points="60,106 57,60 60,66 63,60"/>
        </g>
        <!-- Centre dot -->
        <circle class="compass-dot" cx="60" cy="60" r="5"/>
      </svg>

      <div class="tile-sub" id="wind-gust"></div>
    </div>

    <!-- UV circle -->
    <div class="tile t-uv">
      <div class="tile-value" id="uv">—</div>
      <div class="tile-sub" id="uv-label"></div>
      <div class="tile-label" style="margin-top:4px">UV Index</div>
    </div>

    <!-- Pressure pill -->
    <div class="tile t-pres">
      <div class="tile-label">Pressure</div>
      <div class="tile-value" id="pressure">—</div>
      <div class="tile-sub">hPa</div>
    </div>

    <!-- Rain pill -->
    <div class="tile t-rain">
      <div class="tile-label">Rain</div>
      <div class="tile-value" id="rain">—</div>
      <div class="tile-sub">mm</div>
    </div>

  </div>

  <div class="p-footer" id="updated">—</div>
</div>

<script>
  /* Clock */
  const narrow = () => window.innerWidth <= 500;
  (function tick() {
    const n = new Date();
    document.getElementById('clock').textContent = narrow()
      ? n.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }) +
        ' · ' + n.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })
      : n.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' }) +
        ' · ' + n.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    setTimeout(tick, 1000);
  })();

  /* WMO mappings */
  function wmoCondition(c) {
    if (c === 0)    return 'clear';
    if (c <= 2)     return 'partly-cloudy';
    if (c === 3)    return 'overcast';
    if (c <= 48)    return 'fog';
    if (c <= 55)    return 'drizzle';
    if (c <= 65)    return 'rain';
    if (c <= 77)    return 'snow';
    if (c <= 82)    return 'showers';
    if (c <= 86)    return 'snow';
    return 'storm';
  }
  function wmoEmoji(c, day) {
    if (c === 0)  return day ? '☀️' : '🌙';
    if (c <= 2)   return day ? '⛅' : '☁️🌙';
    if (c === 3)  return '☁️';
    if (c <= 48)  return '🌫️';
    if (c <= 55)  return '🌦️';
    if (c <= 65)  return '🌧️';
    if (c <= 77)  return '❄️';
    if (c <= 82)  return '🌧️';
    if (c <= 86)  return '🌨️';
    return '⛈️';
  }

  /* Particles */
  const P = document.getElementById('particles');
  function clearP() { P.innerHTML = ''; }

  function addRain(n, heavy) {
    clearP();
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'rain-drop';
      const h = heavy ? 22+Math.random()*26 : 12+Math.random()*16;
      const dur = heavy ? 0.3+Math.random()*0.25 : 0.5+Math.random()*0.45;
      d.style.cssText = `left:${Math.random()*115-7}%;height:${h}px;` +
        `animation-duration:${dur.toFixed(2)}s;animation-delay:${(-Math.random()*dur).toFixed(2)}s;` +
        `opacity:${(0.35+Math.random()*0.5).toFixed(2)};`;
      P.appendChild(d);
    }
    if (heavy) {
      const fl = document.createElement('div');
      fl.className = 'lightning-flash';
      P.appendChild(fl);
    }
  }
  function addSnow(n) {
    clearP();
    const g = ['❄','❅','❆','·','·','·'];
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'snow-flake';
      const sz = 10+Math.random()*16, dur = 3.5+Math.random()*6;
      d.textContent = g[Math.floor(Math.random()*g.length)];
      d.style.cssText = `left:${Math.random()*105}%;font-size:${sz}px;` +
        `animation-duration:${dur.toFixed(1)}s;animation-delay:${(-Math.random()*dur).toFixed(2)}s;` +
        `opacity:${(0.4+Math.random()*0.55).toFixed(2)};`;
      P.appendChild(d);
    }
  }
  function addStars(n) {
    clearP();
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'star';
      const sz = Math.random()<0.12 ? 2.5 : Math.random()<0.35 ? 1.5 : 1;
      const dur = 1.2+Math.random()*3.5;
      d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*78}%;` +
        `width:${sz}px;height:${sz}px;` +
        `animation-duration:${dur.toFixed(2)}s;animation-delay:${(-Math.random()*dur).toFixed(2)}s;`;
      P.appendChild(d);
    }
  }
  function addFog(n) {
    clearP();
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'fog-band';
      const h = 35+Math.random()*55, top = 8+i*(80/n)+Math.random()*8;
      const dur = 5+Math.random()*8;
      d.style.cssText = `top:${top}%;height:${h}px;` +
        `animation-duration:${dur.toFixed(1)}s;animation-delay:${(-Math.random()*dur).toFixed(2)}s;` +
        `opacity:${(0.5+Math.random()*0.4).toFixed(2)};`;
      P.appendChild(d);
    }
  }

  /* Sky stage: sun rays, clouds, lightning bolt */
  const sunRaysEl = document.getElementById('sunRays');
  for (let i = 0; i < 12; i++) {
    const r = document.createElement('div');
    r.className = 'ray';
    r.style.transform = `rotate(${i * 30}deg)`;
    sunRaysEl.appendChild(r);
  }

  const cloudsEl = document.getElementById('clouds');
  function addClouds(n, { color = 'rgba(255,255,255,0.75)', minTop = 1, maxTop = 15, minScale = 0.7, maxScale = 1.5, minDur = 70, maxDur = 150 } = {}) {
    cloudsEl.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'cloud';
      const scale = minScale + Math.random() * (maxScale - minScale);
      const w = 130 * scale, h = 46 * scale;
      const top = minTop + Math.random() * (maxTop - minTop);
      const dur = minDur + Math.random() * (maxDur - minDur);
      const op = 0.5 + Math.random() * 0.45;
      c.style.cssText = `width:${w}px;height:${h}px;top:${top}%;background:${color};opacity:${op};` +
        `animation:cloud-drift ${dur.toFixed(0)}s linear infinite;animation-delay:${(-Math.random()*dur).toFixed(0)}s;`;
      cloudsEl.appendChild(c);
    }
  }
  function clearClouds() { cloudsEl.innerHTML = ''; }

  let boltTimer = null;
  function startBolt() {
    const bolt = document.getElementById('boltFlash');
    bolt.style.display = '';
    const place = () => {
      bolt.style.left = (10 + Math.random() * 70) + '%';
      bolt.style.top = (2 + Math.random() * 14) + '%';
      bolt.style.transform = `rotate(${(-8 + Math.random()*16).toFixed(1)}deg) scale(${(0.8+Math.random()*0.6).toFixed(2)})`;
    };
    place();
    boltTimer = setInterval(place, 7000);
  }
  function stopBolt() {
    document.getElementById('boltFlash').style.display = 'none';
    if (boltTimer) { clearInterval(boltTimer); boltTimer = null; }
  }

  const windLinesEl = document.getElementById('windLines');
  function setWindLines(active) {
    windLinesEl.innerHTML = '';
    if (!active) return;
    for (let i = 0; i < 7; i++) {
      const l = document.createElement('div');
      l.className = 'wind-line';
      const w = 60 + Math.random() * 140, dur = 2.5 + Math.random() * 2.5;
      l.style.cssText = `width:${w}px;top:${(8+Math.random()*70).toFixed(0)}%;` +
        `animation-duration:${dur.toFixed(2)}s;animation-delay:${(-Math.random()*dur).toFixed(2)}s;`;
      windLinesEl.appendChild(l);
    }
  }

  function applyTheme(cond, day) {
    document.body.dataset.wx  = cond;
    document.body.dataset.day = day ? '1' : '0';
    stopBolt();
    switch (cond) {
      case 'clear':
        day ? clearP() : addStars(90);
        clearClouds();
        break;
      case 'partly-cloudy':
        day ? clearP() : addStars(45);
        addClouds(4, { color: day ? 'rgba(255,255,255,0.85)' : 'rgba(210,218,235,0.5)' });
        break;
      case 'overcast':
        clearP();
        addClouds(6, { color: 'rgba(180,188,198,0.6)', minTop: 1, maxTop: 15, minScale: 1, maxScale: 1.9, minDur: 90, maxDur: 170 });
        break;
      case 'fog':
        addFog(6);
        addClouds(3, { color: 'rgba(180,190,198,0.4)', minTop: 1, maxTop: 14 });
        break;
      case 'drizzle':
        addRain(15, false);
        addClouds(5, { color: 'rgba(120,140,165,0.55)', minTop: 1, maxTop: 15, minDur: 60, maxDur: 120 });
        break;
      case 'rain':
      case 'showers':
        addRain(32, false);
        addClouds(6, { color: 'rgba(90,108,135,0.6)', minTop: 0, maxTop: 14, minDur: 55, maxDur: 110 });
        break;
      case 'snow':
        addSnow(32);
        addClouds(5, { color: 'rgba(200,208,222,0.5)', minTop: 1, maxTop: 15, minDur: 80, maxDur: 150 });
        break;
      case 'storm':
        addRain(42, true);
        addClouds(6, { color: 'rgba(45,42,60,0.65)', minTop: 0, maxTop: 13, minDur: 45, maxDur: 90 });
        startBolt();
        break;
      default:
        clearP();
        clearClouds();
    }
  }

  /* Helpers */
  const compass = d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];
  const uvLbl   = v => v<3?'Low':v<6?'Moderate':v<8?'High':v<11?'Very High':'Extreme';
  const fmt     = (v,dp=1) => v==null ? '—' : Number(v).toFixed(dp);

  /* Fetch + render */
  async function refresh() {
    try {
      const j = await fetch('/api/weather').then(r => r.json());
      if (j.error) { document.getElementById('condition').textContent = 'Error: '+j.error; return; }
      const d = j.data;

      const code = d.weather_code ?? 0;
      const day  = !!d.is_day;
      const cond = wmoCondition(code);
      applyTheme(cond, day);

      const emoji = wmoEmoji(code, day);
      document.getElementById('wx-icon').textContent  = emoji;
      document.getElementById('wx-ghost').textContent = emoji;

      document.getElementById('location').textContent  = d.location_name || 'Weather';
      document.getElementById('temp').textContent      = fmt(d.temperature_2m, 0);
      document.getElementById('condition').textContent = d.description || '';
      document.getElementById('feels').textContent =
        d.apparent_temperature != null ? `Feels like ${fmt(d.apparent_temperature,0)}°C` : '';

      /* Humidity ring: circumference ≈ 2π×42 = 263.9 */
      const hum = d.relative_humidity_2m;
      document.getElementById('humidity').textContent = fmt(hum, 0);
      if (hum != null) {
        const fill = (hum / 100) * 263.9;
        document.getElementById('hum-ring').style.strokeDasharray = `${fill} 263.9`;
      }

      /* Wind + compass */
      const spd = d.wind_speed_10m, dir = d.wind_direction_10m;
      document.getElementById('wind-speed').textContent =
        `${fmt(spd,0)} mph ${dir!=null ? compass(dir) : ''}`;
      document.getElementById('wind-gust').textContent =
        d.wind_gusts_10m != null ? `Gusts ${fmt(d.wind_gusts_10m,0)} mph` : '';
      if (dir != null)
        document.getElementById('compass-needle').setAttribute('transform', `rotate(${dir},60,60)`);
      setWindLines((d.wind_gusts_10m ?? d.wind_speed_10m ?? 0) >= 22);

      /* Other stats */
      document.getElementById('pressure').textContent = fmt(d.surface_pressure, 0);
      document.getElementById('rain').textContent     = fmt(d.rain, 1);
      const uv = d.uv_index != null ? Math.round(d.uv_index*10)/10 : null;
      document.getElementById('uv').textContent       = uv ?? '—';
      document.getElementById('uv-label').textContent = uv != null ? uvLbl(uv) : '';

      const when = j.fetched_at ? new Date(j.fetched_at*1000).toLocaleTimeString('en-GB') : '—';
      document.getElementById('updated').textContent = `Updated ${when} · Open-Meteo`;
    } catch(e) {
      document.getElementById('condition').textContent = 'Failed to load';
    }
  }

  refresh();
  setInterval(refresh, 5 * 60 * 1000);
</script>
</body>
</html>
