<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weather">
  <meta name="theme-color" content="#0d2a55">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <title>Weather</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      color: #fff;
      --accent: #42a5f5;
      --glow:   rgba(66,165,245,0.45);
      background: linear-gradient(160deg, #0d1b2a 0%, #1a2a3a 100%);
      transition: background 3s ease, --accent 3s;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Sky backgrounds ── */
    body[data-wx="clear"][data-day="1"] {
      background: linear-gradient(160deg, #0a3d91 0%, #1565c0 35%, #42a0e8 70%, #aad4f0 100%);
      --accent: #ffd740; --glow: rgba(255,215,64,0.6);
    }
    body[data-wx="clear"][data-day="0"] {
      background: linear-gradient(160deg, #010208 0%, #030a20 60%, #04102a 100%);
      --accent: #ccd4ff; --glow: rgba(200,210,255,0.45);
    }
    body[data-wx="partly-cloudy"][data-day="1"] {
      background: linear-gradient(160deg, #0d3b7a 0%, #1e62b0 45%, #5090c8 80%, #90c0da 100%);
      --accent: #ffca28; --glow: rgba(255,202,40,0.5);
    }
    body[data-wx="partly-cloudy"][data-day="0"] {
      background: linear-gradient(160deg, #060c1a 0%, #0c1830 60%, #121e3c 100%);
      --accent: #90a8d8; --glow: rgba(144,168,216,0.4);
    }
    body[data-wx="overcast"] {
      background: linear-gradient(160deg, #181e2a 0%, #222b38 50%, #2e3848 100%);
      --accent: #90a4ae; --glow: rgba(144,164,174,0.35);
    }
    body[data-wx="fog"] {
      background: linear-gradient(160deg, #26303c 0%, #36424e 50%, #4e5a66 100%);
      --accent: #b0bec5; --glow: rgba(176,190,197,0.35);
    }
    body[data-wx="drizzle"] {
      background: linear-gradient(160deg, #0c1620 0%, #121e2c 50%, #182838 100%);
      --accent: #81d4fa; --glow: rgba(129,212,250,0.4);
    }
    body[data-wx="rain"], body[data-wx="showers"] {
      background: linear-gradient(160deg, #05080f 0%, #090e1a 50%, #0e1520 100%);
      --accent: #42a5f5; --glow: rgba(66,165,245,0.45);
    }
    body[data-wx="snow"] {
      background: linear-gradient(160deg, #18202e 0%, #22303e 50%, #2c3848 100%);
      --accent: #e3f2fd; --glow: rgba(227,242,253,0.5);
    }
    body[data-wx="storm"] {
      background: linear-gradient(160deg, #020408 0%, #060a10 50%, #080f18 100%);
      --accent: #7e57c2; --glow: rgba(126,87,194,0.6);
    }

    /* ── Particles ── */
    #particles {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 1; overflow: hidden;
    }
    .rain-drop {
      position: absolute; top: -30px; width: 1.5px;
      background: linear-gradient(to bottom, transparent, rgba(180,220,255,0.55));
      border-radius: 1px;
      animation: rain-fall linear infinite;
      transform: rotate(-12deg);
    }
    @keyframes rain-fall { to { transform: rotate(-12deg) translateY(110vh); } }

    .snow-flake {
      position: absolute; top: -30px;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 0 4px rgba(255,255,255,0.4);
      animation: snow-fall linear infinite;
    }
    @keyframes snow-fall { to { transform: translateY(110vh) rotate(720deg); } }

    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.1; transform: scale(0.7); }
      to   { opacity: 1;   transform: scale(1.3); }
    }
    .fog-band {
      position: absolute; left: -10%; right: -10%;
      background: linear-gradient(to right, transparent, rgba(200,210,222,0.12), transparent);
      filter: blur(10px);
      animation: fog-drift ease-in-out infinite alternate;
    }
    @keyframes fog-drift {
      from { transform: translateX(-18px); }
      to   { transform: translateX( 18px); }
    }
    .lightning-flash {
      position: fixed; inset: 0; background: #fff;
      pointer-events: none;
      animation: lightning 7s ease infinite;
    }
    @keyframes lightning {
      0%,84%,87%,89%,100% { opacity: 0; }
      85%,88%              { opacity: 0.09; }
    }

    /* ── Sky stage: sun / moon / clouds ── */
    #sky-stage { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }

    .sun-wrap {
      position: absolute; top: -54px; right: -46px; width: 190px; height: 190px;
      opacity: 0; transition: opacity 2.5s;
    }
    body[data-wx="clear"][data-day="1"] .sun-wrap,
    body[data-wx="partly-cloudy"][data-day="1"] .sun-wrap { opacity: 1; }
    body[data-wx="partly-cloudy"][data-day="1"] .sun-wrap { opacity: 0.55; }
    .sun-core {
      position: absolute; inset: 32%; border-radius: 50%;
      background: radial-gradient(circle, #fffcf0 0%, #ffe066 40%, #ffb300 75%, transparent 100%);
      box-shadow: 0 0 46px 18px rgba(255,200,50,0.42), 0 0 90px 40px rgba(255,170,40,0.18);
      animation: sun-pulse 6s ease-in-out infinite;
    }
    @keyframes sun-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    .sun-rays { position: absolute; inset: 0; animation: sun-rotate 90s linear infinite; }
    .ray {
      position: absolute; left: 50%; top: 50%; width: 3px; height: 48%;
      background: linear-gradient(to top, transparent, rgba(255,214,90,0.42));
      transform-origin: bottom center;
    }
    @keyframes sun-rotate { to { transform: rotate(360deg); } }

    .moon-wrap {
      position: absolute; top: -38px; right: -30px; width: 116px; height: 116px;
      opacity: 0; transition: opacity 2.5s;
      filter: drop-shadow(0 0 30px rgba(210,222,255,0.4)) drop-shadow(0 0 56px rgba(190,205,255,0.2));
      animation: moon-breathe 8s ease-in-out infinite;
    }
    body[data-wx="clear"][data-day="0"] .moon-wrap,
    body[data-wx="partly-cloudy"][data-day="0"] .moon-wrap { opacity: 1; }
    body[data-wx="partly-cloudy"][data-day="0"] .moon-wrap { opacity: 0.5; }
    @keyframes moon-breathe { 0%,100% { filter: drop-shadow(0 0 30px rgba(210,222,255,0.4)) drop-shadow(0 0 56px rgba(190,205,255,0.2)); } 50% { filter: drop-shadow(0 0 40px rgba(210,222,255,0.55)) drop-shadow(0 0 70px rgba(190,205,255,0.28)); } }

    @media (max-width: 420px) {
      .sun-wrap  { width: 140px; height: 140px; top: -40px; right: -36px; }
      .moon-wrap { width: 90px;  height: 90px;  top: -28px; right: -24px; }
    }

    .cloud {
      position: absolute; background: rgba(255,255,255,0.85); border-radius: 50px;
      filter: blur(0.4px);
    }
    .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
    .cloud::before { width: 55%; height: 140%; top: -70%; left: 12%; }
    .cloud::after  { width: 42%; height: 110%; top: -50%; right: 15%; }
    @keyframes cloud-drift { from { transform: translateX(-24vw); } to { transform: translateX(124vw); } }

    .bolt-flash {
      position: absolute; z-index: 2; pointer-events: none;
      animation: lightning 7s ease infinite;
      filter: drop-shadow(0 0 14px rgba(255,255,255,0.9));
    }

    .wind-line {
      position: absolute; height: 1.5px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
      animation: wind-blow linear infinite;
    }
    @keyframes wind-blow {
      from { transform: translateX(-15vw); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.6; }
      to   { transform: translateX(115vw); opacity: 0; }
    }

    /* ── Ghost emoji ── */
    #wx-ghost {
      position: fixed; bottom: -4%; right: -2%;
      font-size: clamp(180px, 32vw, 380px);
      line-height: 1;
      opacity: 0.04;
      pointer-events: none; user-select: none;
      z-index: 1;
      filter: blur(3px);
      animation: ghost-sway 10s ease-in-out infinite;
      transition: opacity 3s;
    }
    @keyframes ghost-sway {
      0%,100% { transform: rotate(-4deg) translateY(0); }
      50%     { transform: rotate( 4deg) translateY(-15px); }
    }

    /* ── App shell ──
       One column, phone-first. Everything readable sits on dark glass so it
       holds up over the bright daytime skies; the sky art stays behind. */
    :root {
      --ink:   #ffffff;
      --ink-2: rgba(255,255,255,0.80);
      --ink-3: rgba(255,255,255,0.58);
      --glass: rgba(10,24,52,0.30);
      --hair:  rgba(255,255,255,0.14);
      --rain:  #8fd0ff;
      --tab:   #ffd21f;
      --tab-ink: #0b1633;
      --bar:   rgba(8,16,40,0.84);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; }

    .page {
      position: relative; z-index: 2;
      width: 100%; max-width: 540px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 2.2rem)
               max(1rem, env(safe-area-inset-right))
               calc(env(safe-area-inset-bottom) + 1.5rem)
               max(1rem, env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: 0.75rem;
    }

    /* Hero */
    .hero {
      text-align: center; color: var(--ink);
      text-shadow: 0 1px 14px rgba(0,0,0,0.28);
      padding-bottom: 0.4rem;
    }
    .hero h1 { font-size: 1.85rem; font-weight: 500; letter-spacing: 0.005em; }
    #clock { font-size: 0.8rem; color: var(--ink-2); margin-top: 0.1rem; font-variant-numeric: tabular-nums; }
    .hero-temp {
      font-size: 6.4rem; font-weight: 200; line-height: 1;
      letter-spacing: -0.04em; margin: 0.35rem 0 0.1rem 0.25em;
      font-variant-numeric: tabular-nums;
    }
    .hero-cond { font-size: 1.1rem; font-weight: 500; color: var(--ink-2); }
    .hero-hilo { font-size: 1.05rem; font-weight: 500; margin-top: 0.1rem; font-variant-numeric: tabular-nums; }
    .hero-hilo span + span { margin-left: 0.7rem; }

    /* Caption bar: the one loud thing on the page */
    .caption { margin: 0.2rem 0 0.35rem; }
    .cap-bar {
      background: var(--bar);
      border-left: 4px solid var(--tab);
      padding: 0.7rem 1rem 0.75rem;
    }
    #condition {
      font: 600 1.4rem/1.15 'Barlow Condensed', 'Arial Narrow', sans-serif;
      color: var(--ink);
    }
    #feels { font-size: 0.85rem; color: var(--ink-2); margin-top: 0.35rem; line-height: 1.35; }
    .caption.wipe .cap-bar { animation: wipe 0.55s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

    /* Met Office warnings: official text, coloured by level */
    .warnings { display: grid; gap: 0.4rem; margin-bottom: 0.35rem; }
    .warn {
      display: block; text-decoration: none; color: #1a1300;
      background: #ffd21f; border-radius: 14px; padding: 0.65rem 0.9rem;
    }
    .warn.amber { background: #ff9f1c; }
    .warn.red   { background: #e53935; color: #fff; }
    .warn.thunder { background: #6d4aff; color: #fff; }
    .warn b { display: block; font: 700 1.05rem/1.2 'Barlow Condensed', 'Arial Narrow', sans-serif; }
    .warn p { font-size: 0.82rem; line-height: 1.35; margin-top: 0.25rem; }
    .warn .kicker { font-weight: 600; }

    /* Glass panels */
    .panel {
      background: var(--glass);
      border: 1px solid var(--hair);
      border-radius: 20px;
      backdrop-filter: blur(22px) saturate(1.3);
      -webkit-backdrop-filter: blur(22px) saturate(1.3);
      padding: 0.85rem 1rem;
      color: var(--ink);
    }
    .panel h2 { font-size: 0.8rem; font-weight: 600; color: var(--ink-3); margin-bottom: 0.45rem; }
    .panel-summary { font-size: 0.92rem; line-height: 1.4; color: var(--ink); }
    .panel-summary + .panel-summary { margin-top: 0.3rem; }
    .panel hr { border: 0; border-top: 1px solid var(--hair); margin: 0.75rem 0 0.6rem; }

    /* Hourly */
    .hours {
      display: flex; gap: 0.2rem;
      overflow-x: auto; scrollbar-width: none;
      margin: 0 -1rem; padding: 0 0.6rem;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }
    .hours::-webkit-scrollbar { display: none; }
    .hour {
      flex: 0 0 3.7rem; scroll-snap-align: start;
      display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
      padding: 0.15rem 0 0.25rem;
      font-variant-numeric: tabular-nums;
    }
    .hour .h-time { font-size: 0.85rem; font-weight: 600; }
    .hour .h-icon { font-size: 1.45rem; line-height: 1.6rem; height: 1.6rem; }
    .hour .h-rain { font-size: 0.72rem; font-weight: 600; color: var(--rain); height: 1rem; line-height: 1rem; }
    .hour .h-temp { font-size: 1.1rem; font-weight: 600; }
    .hour .h-range { font-size: 0.7rem; color: var(--ink-3); margin-top: -0.2rem; white-space: nowrap; }
    .hour.midnight { border-left: 1px solid var(--hair); }
    .hour.midnight .h-time { color: var(--ink); }
    /* Rain chance coloured by how hard it'd come down if it does */
    .h-rain.light, .d-pop.light { opacity: 0.6; }
    .h-rain.heavy, .d-pop.heavy { color: #fff; background: #2f7dff; border-radius: 4px; padding: 0 3px; }

    /* Day chips above the hourly strip; tap to jump, highlight follows the scroll */
    .day-tabs { display: flex; gap: 0.35rem; margin: 0 0 0.85rem; overflow-x: auto; scrollbar-width: none; }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      flex: none; border: 0; cursor: pointer; font: inherit; font-size: 0.78rem; font-weight: 600;
      padding: 0.3rem 0.7rem; border-radius: 999px;
      background: rgba(255,255,255,0.08); color: var(--ink-2);
    }
    .day-tab.on { background: rgba(255,255,255,0.24); color: var(--ink); }
    .rain-key { font-size: 0.7rem; color: var(--ink-3); margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px solid var(--hair); }
    .rain-key b { font-weight: 600; color: var(--rain); }
    .rain-key b.light { opacity: 0.6; }
    .rain-key b.heavy { color: #fff; background: #2f7dff; border-radius: 3px; padding: 0 3px; }

    /* Week: one fixed-height data line per day, quip underneath flush with the day name */
    #fc-outlook .panel-summary { font-size: 0.88rem; color: var(--ink-2); }
    .day {
      display: grid;
      grid-template-columns: 2.6rem 1.7rem 2.3rem 2rem 1fr 2rem;
      grid-template-rows: 1.8rem auto;
      align-items: center; column-gap: 0.5rem;
      padding: 0.5rem 0 0.55rem;
      border-top: 1px solid var(--hair);
      font-variant-numeric: tabular-nums;
    }
    .day:first-of-type { border-top: 0; padding-top: 0.1rem; }
    .d-name { font-size: 1.05rem; font-weight: 600; }
    .d-icon { font-size: 1.3rem; line-height: 1; text-align: center; }
    .d-pop  { font-size: 0.75rem; font-weight: 600; color: var(--rain); }
    .d-lo { font-size: 1.05rem; font-weight: 500; color: var(--ink-3); text-align: right; }
    .d-hi { font-size: 1.05rem; font-weight: 600; text-align: right; }
    .d-track { position: relative; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.22); }
    .d-fill  { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
    /* The 10th-90th percentile spread: how far off the forecast could plausibly be */
    .d-band  { position: absolute; top: -3px; bottom: -3px; border-radius: 5px; background: rgba(255,255,255,0.16); }
    .d-quip .d-mm { color: var(--rain); white-space: nowrap; }
    .d-quip {
      grid-column: 1 / -1; font-size: 0.8rem; color: var(--ink-3);
      line-height: 1.3; margin-top: 0.1rem;
    }

    /* Widget grid */
    .hist-tabs { display: flex; gap: 0.35rem; margin: 0.3rem 0 0.4rem; }
    .hist-tabs button { font: inherit; font-size: 0.82rem; color: var(--ink-2); background: transparent;
      border: 1px solid var(--hair); border-radius: 99px; padding: 0.2rem 0.7rem; cursor: pointer; }
    .hist-tabs button.on { background: var(--tab); color: var(--tab-ink); border-color: transparent; font-weight: 600; }
    .hist-h { font-size: 0.8rem; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; margin: 0.6rem 0 0.1rem; }
    .hist-svg { width: 100%; height: 200px; display: block; overflow: visible; }
    .hist-svg.hist-short { height: 110px; }
    .hist-svg text { fill: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
    .hist-svg .grid { stroke: var(--hair); stroke-width: 1; }
    .hist-key { display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; font-size: 0.8rem; color: var(--ink-2); margin-top: 0.3rem; }
    .hist-key i { display: inline-block; width: 1.1em; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 0.35em; }
    html.hub #p-hist, html.hub #p-blend { display: none; }
    .widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .widget {
      aspect-ratio: 1; display: flex; flex-direction: column;
      padding: 0.8rem 0.9rem; min-width: 0;
    }
    .widget h2 { margin-bottom: 0.2rem; }
    .w-val { font-size: 2rem; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .w-val small { font-size: 1rem; font-weight: 500; color: var(--ink-2); margin-left: 0.15rem; }
    .w-sub { font-size: 0.82rem; color: var(--ink-2); line-height: 1.3; margin-top: auto; }
    .w-note { font-size: 0.9rem; font-weight: 600; margin-top: 0.1rem; }

    .w-wind { position: relative; }
    .w-wind .compass-svg { position: absolute; right: 0.6rem; top: 0.6rem; width: 44%; height: auto; }
    .compass-ring  { fill: none; stroke: rgba(255,255,255,0.18); stroke-width: 1.5; }
    .compass-tick  { stroke: rgba(255,255,255,0.3); stroke-width: 1; stroke-linecap: round; }
    .compass-label { fill: rgba(255,255,255,0.55); font-size: 10px; font-family: system-ui; }
    .compass-dot   { fill: rgba(255,255,255,0.6); }
    #compass-north { fill: var(--tab); }
    #compass-south { fill: rgba(255,255,255,0.35); }

    .uv-track {
      position: relative; height: 5px; border-radius: 3px; margin: 0.6rem 0 0.2rem;
      background: linear-gradient(90deg, #4cd964, #ffd21f 35%, #ff9500 60%, #ff3b30 80%, #af52de);
    }
    .uv-dot {
      position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
      border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.35);
    }

    .ring-wrap { position: relative; width: 58%; margin: 0.1rem auto 0; }
    .ring-svg { display: block; width: 100%; height: auto; }
    .ring-track { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 7; }
    .ring-fill  {
      fill: none; stroke: var(--rain); stroke-width: 7; stroke-linecap: round;
      stroke-dasharray: 0 264; transform: rotate(-90deg); transform-origin: 50% 50%;
      transition: stroke-dasharray 1s ease;
    }
    .ring-wrap .w-val {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }

    .p-footer {
      text-align: center; font-size: 0.75rem; color: var(--ink-3);
      margin-top: 0.5rem; line-height: 1.5;
    }

    @media (min-width: 700px) {
      .page { padding-top: 3.5rem; }
      .hero-temp { font-size: 7.5rem; }
      .widgets { grid-template-columns: repeat(3, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      .caption.wipe .cap-bar { animation: none; }
    }

    /* ── Nest Hub (#hub): one landscape 1024×600 screen, nobody touching it ──
       Headline on the left, forecast on the right, no scrolling. Sized in rem
       off the viewport width so a Hub Max (1280×800) scales up too. On phones
       the two groups are display:contents, so the single column is unchanged. */
    .lead, .detail { display: contents; }

    html.hub { font-size: clamp(14px, 2.1vw, 26px); }
    html.hub body { height: 100vh; overflow: hidden; }
    html.hub .panel { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(10,24,52,0.42); }
    html.hub .page {
      max-width: none; height: 100vh; padding: 0.7rem 0.9rem;
      display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); gap: 0.9rem;
    }
    html.hub .lead, html.hub .detail { display: flex; flex-direction: column; gap: 0.55rem; min-height: 0; }
    html.hub .lead { justify-content: space-between; }
    html.hub .p-footer, html.hub .day-tabs, html.hub .rain-key,
    html.hub #p-hours hr, html.hub #p-days hr, html.hub #p-days h2, html.hub #fc-outlook { display: none; }

    html.hub .hero { padding: 0; }
    html.hub .hero h1 { font-size: 1.4rem; }
    html.hub #clock { font-size: 0.85rem; }
    html.hub .hero-temp { font-size: 6.6rem; margin: 0.1rem 0 0 0.25em; }
    html.hub .caption { margin: 0; }
    html.hub .cap-bar { padding: 0.6rem 0.8rem 0.65rem; }
    html.hub #condition { font-size: 1.45rem; }
    html.hub #feels { font-size: 0.95rem; }
    html.hub .warn p { display: none; }

    /* Hours: as many as fit from "Now", the rest just run off the edge */
    html.hub #p-hours { padding: 0.6rem 0.8rem; }
    html.hub #fc-now .panel-summary { font-size: 0.95rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    html.hub #fc-now .panel-summary + .panel-summary { display: none; }
    html.hub #fc-now { margin-bottom: 0.4rem; }
    /* Whole hours only: the ones that don't fit wrap into zero-height rows */
    html.hub .hours {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(3.1rem, 1fr));
      grid-template-rows: auto; grid-auto-rows: 0; row-gap: 0;
      overflow: hidden; margin: 0 -0.3rem; padding: 0;
    }
    html.hub .hour { gap: 0.25rem; padding: 0; }
    html.hub .hour .h-time  { font-size: 0.95rem; }
    html.hub .hour .h-rain  { font-size: 0.8rem; }
    html.hub .hour .h-temp  { font-size: 1.2rem; }
    html.hub .hour .h-range { font-size: 0.75rem; margin-top: -0.1rem; }

    /* Days: the week as six columns rather than rows */
    html.hub #p-days { flex: 1; display: flex; align-items: center; padding: 0.5rem 0.6rem; }
    html.hub #fc-days { width: 100%; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
    html.hub .day {
      grid-template-columns: 1fr; grid-template-rows: none;
      grid-template-areas: "name" "icon" "pop" "hi" "lo";
      justify-items: center; row-gap: 0.2rem;
      padding: 0; border-top: 0; border-left: 1px solid var(--hair);
    }
    html.hub .day:first-of-type { border-left: 0; padding: 0; }
    html.hub .d-name { grid-area: name; font-size: 1.2rem; }
    html.hub .d-icon { grid-area: icon; font-size: 1.7rem; }
    html.hub .d-pop  { grid-area: pop; height: 1.1rem; font-size: 0.85rem; }
    html.hub .d-hi   { grid-area: hi; font-size: 1.3rem; text-align: center; }
    html.hub .d-lo   { grid-area: lo; font-size: 1.1rem; text-align: center; }
    html.hub .d-track, html.hub .d-quip { display: none; }

    /* Widgets: one row of tiles, headline numbers only; humidity and pressure
       don't earn a slot on a kitchen screen */
    html.hub .widgets { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem; }
    html.hub .widgets > :nth-child(2), html.hub .widgets > :nth-child(6), html.hub .widgets > :nth-child(n+7) { display: none; }
    html.hub .widget { aspect-ratio: auto; padding: 0.45rem 0.7rem 0.5rem; }
    html.hub .widget h2 { font-size: 0.8rem; margin-bottom: 0.1rem; }
    html.hub .w-val { font-size: 1.4rem; white-space: nowrap; }
    html.hub .w-val small { font-size: 0.8rem; margin-left: 0.1rem; }
    html.hub .w-note { font-size: 0.8rem; font-weight: 500; color: var(--ink-2); line-height: 1.25; }
    html.hub .w-sub, html.hub .compass-svg, html.hub .ring-svg { display: none; }
    html.hub .ring-wrap { width: auto; margin: 0; }
    html.hub .ring-wrap .w-val { position: static; display: block; font-size: 1.45rem; }
    html.hub .uv-track { margin: 0.45rem 0 0; }
  </style>
  <script>if (location.hash === '#hub') document.documentElement.classList.add('hub');</script>
</head>

<main class="page">

  <header class="hero">
    <h1 id="location">Weather</h1>

<script>
  /* Clock */
  (function tick() {
    const n = new Date();
    document.getElementById('clock').textContent =
      n.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' +
      n.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    setTimeout(tick, 1000 * (60 - n.getSeconds()));
  })();

  /* WMO mappings */
  function wmoCondition(c) {
    if (c === 0)    return 'clear';
    if (c <= 2)     return 'partly-cloudy';
    if (c === 3)    return 'overcast';
    if (c <= 48)    return 'fog';
    if (c <= 55)    return 'drizzle';
    if (c <= 65)    return 'rain';
    if (c <= 77)    return 'snow';
    if (c <= 82)    return 'showers';
    if (c <= 86)    return 'snow';
    return 'storm';
  }
  function wmoEmoji(c, day) {
    if (c === 0)  return day ? '☀️' : '🌙';
    if (c <= 2)   return day ? '⛅' : '☁️🌙';
    if (c === 3)  return '☁️';
    if (c <= 48)  return '🌫️';
    if (c <= 55)  return '🌦️';
    if (c <= 65)  return '🌧️';
    if (c <= 77)  return '❄️';
    if (c <= 82)  return '🌧️';
    if (c <= 86)  return '🌨️';
    return '⛈️';
  }

  /* Particles */
  const P = document.getElementById('particles');
  function clearP() { P.innerHTML = ''; }

  function addRain(n, heavy) {
    clearP();
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'rain-drop';
      const h = heavy ? 22+Math.random()*26 : 12+Math.random()*16;
      const dur = heavy ? 0.3+Math.random()*0.25 : 0.5+Math.random()*0.45;
      d.style.cssText = `left:${Math.random()*115-7}%;height:${h}px;` +
        `animation-duration:${dur.toFixed(2)}s;animation-delay:${(-Math.random()*dur).toFixed(2)}s;` +
        `opacity:${(0.35+Math.random()*0.5).toFixed(2)};`;
      P.appendChild(d);
    }
    if (heavy) {
      const fl = document.createElement('div');
      fl.className = 'lightning-flash';
      P.appendChild(fl);
    }
  }
  function addSnow(n) {
    clearP();
    const g = ['❄','❅','❆','·','·','·'];
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'snow-flake';
      const sz = 10+Math.random()*16, dur = 3.5+Math.random()*6;
      d.textContent = g[Math.floor(Math.random()*g.length)];
      d.style.cssText = `left:${Math.random()*105}%;font-size:${sz}px;` +
        `animation-duration:${dur.toFixed(1)}s;animation-delay:${(-Math.random()*dur).toFixed(2)}s;` +
        `opacity:${(0.4+Math.random()*0.55).toFixed(2)};`;
      P.appendChild(d);
    }
  }
  function addStars(n) {
    clearP();
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'star';
      const sz = Math.random()<0.12 ? 2.5 : Math.random()<0.35 ? 1.5 : 1;
      const dur = 1.2+Math.random()*3.5;
      d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*78}%;` +
        `width:${sz}px;height:${sz}px;` +
        `animation-duration:${dur.toFixed(2)}s;animation-delay:${(-Math.random()*dur).toFixed(2)}s;`;
      P.appendChild(d);
    }
  }
  function addFog(n) {
    clearP();
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'fog-band';
      const h = 35+Math.random()*55, top = 8+i*(80/n)+Math.random()*8;
      const dur = 5+Math.random()*8;
      d.style.cssText = `top:${top}%;height:${h}px;` +
        `animation-duration:${dur.toFixed(1)}s;animation-delay:${(-Math.random()*dur).toFixed(2)}s;` +
        `opacity:${(0.5+Math.random()*0.4).toFixed(2)};`;
      P.appendChild(d);
    }
  }

  /* Sky stage: sun rays, clouds, lightning bolt */
  const sunRaysEl = document.getElementById('sunRays');
  for (let i = 0; i < 12; i++) {
    const r = document.createElement('div');
    r.className = 'ray';
    r.style.transform = `rotate(${i * 30}deg)`;
    sunRaysEl.appendChild(r);
  }

  const cloudsEl = document.getElementById('clouds');
  function addClouds(n, { color = 'rgba(255,255,255,0.75)', minTop = 1, maxTop = 15, minScale = 0.7, maxScale = 1.5, minDur = 70, maxDur = 150 } = {}) {
    cloudsEl.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'cloud';
      const scale = minScale + Math.random() * (maxScale - minScale);
      const w = 130 * scale, h = 46 * scale;
      const top = minTop + Math.random() * (maxTop - minTop);
      const dur = minDur + Math.random() * (maxDur - minDur);
      const op = 0.5 + Math.random() * 0.45;
      c.style.cssText = `width:${w}px;height:${h}px;top:${top}%;background:${color};opacity:${op};` +
        `animation:cloud-drift ${dur.toFixed(0)}s linear infinite;animation-delay:${(-Math.random()*dur).toFixed(0)}s;`;
      cloudsEl.appendChild(c);
    }
  }
  function clearClouds() { cloudsEl.innerHTML = ''; }

  let boltTimer = null;
  function startBolt() {
    const bolt = document.getElementById('boltFlash');
    bolt.style.display = '';
    const place = () => {
      bolt.style.left = (10 + Math.random() * 70) + '%';
      bolt.style.top = (2 + Math.random() * 14) + '%';
      bolt.style.transform = `rotate(${(-8 + Math.random()*16).toFixed(1)}deg) scale(${(0.8+Math.random()*0.6).toFixed(2)})`;
    };
    place();
    boltTimer = setInterval(place, 7000);
  }
  function stopBolt() {
    document.getElementById('boltFlash').style.display = 'none';
    if (boltTimer) { clearInterval(boltTimer); boltTimer = null; }
  }

  const windLinesEl = document.getElementById('windLines');
  function setWindLines(active) {
    windLinesEl.innerHTML = '';
    if (!active) return;
    for (let i = 0; i < 7; i++) {
      const l = document.createElement('div');
      l.className = 'wind-line';
      const w = 60 + Math.random() * 140, dur = 2.5 + Math.random() * 2.5;
      l.style.cssText = `width:${w}px;top:${(8+Math.random()*70).toFixed(0)}%;` +
        `animation-duration:${dur.toFixed(2)}s;animation-delay:${(-Math.random()*dur).toFixed(2)}s;`;
      windLinesEl.appendChild(l);
    }
  }

  function applyTheme(cond, day) {
    document.body.dataset.wx  = cond;
    document.body.dataset.day = day ? '1' : '0';
    stopBolt();
    switch (cond) {
      case 'clear':
        day ? clearP() : addStars(90);
        clearClouds();
        break;
      case 'partly-cloudy':
        day ? clearP() : addStars(45);
        addClouds(4, { color: day ? 'rgba(255,255,255,0.85)' : 'rgba(210,218,235,0.5)' });
        break;
      case 'overcast':
        clearP();
        addClouds(6, { color: 'rgba(180,188,198,0.6)', minTop: 1, maxTop: 15, minScale: 1, maxScale: 1.9, minDur: 90, maxDur: 170 });
        break;
      case 'fog':
        addFog(6);
        addClouds(3, { color: 'rgba(180,190,198,0.4)', minTop: 1, maxTop: 14 });
        break;
      case 'drizzle':
        addRain(15, false);
        addClouds(5, { color: 'rgba(120,140,165,0.55)', minTop: 1, maxTop: 15, minDur: 60, maxDur: 120 });
        break;
      case 'rain':
      case 'showers':
        addRain(32, false);
        addClouds(6, { color: 'rgba(90,108,135,0.6)', minTop: 0, maxTop: 14, minDur: 55, maxDur: 110 });
        break;
      case 'snow':
        addSnow(32);
        addClouds(5, { color: 'rgba(200,208,222,0.5)', minTop: 1, maxTop: 15, minDur: 80, maxDur: 150 });
        break;
      case 'storm':
        addRain(42, true);
        addClouds(6, { color: 'rgba(45,42,60,0.65)', minTop: 0, maxTop: 13, minDur: 45, maxDur: 90 });
        startBolt();
        break;
      default:
        clearP();
        clearClouds();
    }
  }

  /* Helpers */
  const compass = d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];

  /* Sweary weather. Page-only: /api/weather
     keeps the clean WMO text for the home_menu card. Variants rotate hourly so the
     5-minute refresh doesn't reshuffle the joke under you; each caller passes its
     own salt so the lines on screen don't all turn over in lockstep. */

  /* Hour of the epoch plus a salt. Pools are all under 24 lines, so the same

  const HEAVY = new Set([65, 82, 86, 75, 99]);
  /* Quips rotate through each bucket across the week, so three drizzly days get

  function assignQuips(daily) {

  /* Commentary, split two ways: the next few hours go on the hourly
     panel, tomorrow and the week go on the six-day panel. */
  function outlook(hours, daily, nowCode) {
    const now = [], week = [];

    const wetNow = isWet(nowCode);
    if (!wetNow) {
      /* With the probabilistic feed, a wet weather code only counts if the rain
         chance backs it up; otherwise a 0% "coin toss" slips through */
      const r = hours.find(h => h.pop >= 50 || (isWet(h.code) && (h.p1 == null || h.pop >= 30)));
      if (r) {
        const pool = r.pop >= 80 ? OUT.rainSure : r.pop >= 50 ? OUT.rainLikely : OUT.rainToss;
        now.push(pick(pool, 11)(hh(r.time), r.pop ?? '?', rainKind(r)));
      } else now.push(pick(OUT.dry, 11));
    } else {
      const d = hours.find(h => h.pop < 30 && !isWet(h.code));
      now.push(d ? pick(OUT.stops, 11)(hh(d.time)) : pick(OUT.wetAll, 11));
    }

    const night = hours.filter(h => !h.day);
    if (night.length) {
      const lo = Math.round(Math.min(...night.map(h => h.temp)));
      if (lo <= 3) now.push(pick(OUT.coldNight, 13)(lo));
      else if (lo >= 17) now.push(pick(OUT.warmNight, 13)(lo));
    }

    if (daily.length > 1 && daily.length < 4) {
      const t = daily[1];
      week.push(`Tomorrow: ${Math.round(t.hi)}°, ${t.quip.charAt(0).toLowerCase() + t.quip.slice(1).replace(/\.$/, '')}` +
        (t.pop >= 60 ? `. ${t.pop}% chance of rain. ${pick(OUT.brolly, 17)}` : '.'));
    }

    const rest = daily.slice(2);
    if (rest.length >= 2) {
      const score = d => d.hi - d.pop / 8 - (isWet(d.code) ? 4 : 0);
      const best  = rest.reduce((a, b) => score(b) > score(a) ? b : a);
      const worst = rest.reduce((a, b) => score(b) < score(a) ? b : a);
      if (best.date !== worst.date) {
        week.push(`Best day's ${DAYSL[dow(best.date)]}, ${Math.round(best.hi)}°` +
          pick(best.pop < 30 && !isWet(best.code) ? OUT.bestDry : best.pop < 30 ? OUT.bestMost : OUT.bestMeh, 19) +
          ` Worst is ${DAYSL[dow(worst.date)]}` +
          (worst.pop >= 50 ? pick(OUT.worstWet, 23)(worst.pop) : pick(OUT.worstMeh, 23)));
      }
    }
    /* Confidence: the day whose high is least certain, from the percentile spread */
    const conf = daily.slice(1).filter(d => d.b && d.b.hi90 != null);
    if (conf.length >= 3) {
      const spread = d => d.b.hi90 - d.b.hi10;
      const wide = conf.reduce((a, b) => spread(b) > spread(a) ? b : a);
      if (spread(wide) >= 5)
        week.push(pick(OUT.guess, 29)(DAYSL[dow(wide.date)], Math.round(wide.b.hi10), Math.round(wide.b.hi90)));
      else week.push(pick(spread(wide) < 3 ? OUT.sure : OUT.fair, 29));
    }
    return { now, week };
  }

  /* Colour for a temperature, used on the week's range bars */
  const T_STOPS = [[-5,[94,156,255]],[5,[98,201,255]],[12,[111,224,192]],[18,[255,210,31]],[24,[255,159,67]],[30,[255,90,60]]];
  function tempColor(t) {
    if (t <= T_STOPS[0][0]) return `rgb(${T_STOPS[0][1]})`;
    for (let i = 1; i < T_STOPS.length; i++) {
      const [t1, c1] = T_STOPS[i];
      if (t <= t1) {
        const [t0, c0] = T_STOPS[i - 1], k = (t - t0) / (t1 - t0);
        return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * k))})`;
      }
    }
    return `rgb(${T_STOPS[T_STOPS.length - 1][1]})`;
  }

  const paras = lines => lines.map(l => `<p class="panel-summary">${esc(l)}</p>`).join('');

  const hourWet = h => h.p1 == null ? '' : h.p4 >= 30 ? 'heavy' : h.p1 >= 30 ? '' : 'light';

    if (!b || b.rain1 == null || b.rain1 < 30 || b.mm75 == null) return '';

  function renderForecast(fc, nowTime, nowCode, bpf) {
    const ph = document.getElementById('p-hours'), pd = document.getElementById('p-days');
    if (!fc || !fc.hourly || !fc.daily) { ph.hidden = pd.hidden = true; today = null; return; }
    const H = fc.hourly, D = fc.daily;
    const nowHour = (nowTime || '').slice(0, 13);

    const daily = D.time.map((t, i) => ({
      date: t, code: D.weather_code[i], hi: D.temperature_2m_max[i], lo: D.temperature_2m_min[i],
      pop: D.precipitation_probability_max[i] ?? 0, rain: D.precipitation_sum?.[i],
      sunrise: D.sunrise?.[i], sunset: D.sunset?.[i],
    }));
    const sun = Object.fromEntries(daily.map(d => [d.date, d]));
    const isDayAt = t => { const s = sun[t.slice(0, 10)]; return s && s.sunrise ? t >= s.sunrise && t < s.sunset : true; };

       rain intensity; without it, 12 hours from the main forecast */

      const start = Math.max(0, H.time.findIndex(t => t.slice(0, 13) >= nowHour));

        time: t, temp: H.temperature_2m[start + i], pop: H.precipitation_probability[start + i],
        code: H.weather_code[start + i], day: !!H.is_day[start + i],
      }));
    }

    const bDay = bpf ? Object.fromEntries(cols(bpf.daily).map(b => [b.time, b])) : {};
    for (const d of daily) d.b = bDay[d.date];
    assignQuips(daily);
    today = daily[0];
    today.tomorrowSunrise = daily[1]?.sunrise;

    const o = outlook(hours.slice(0, 12), daily, nowCode);
    document.getElementById('fc-now').innerHTML = paras(o.now);
    document.getElementById('fc-outlook').innerHTML = paras(o.week);

    const strip = document.getElementById('fc-hours');
    const keep = strip.scrollLeft;   /* don't yank the strip back while someone's swiping */
    strip.innerHTML = hours.map((h, i) => {
      const midnight = i > 0 && h.time.slice(11, 13) === '00';
      const label = i === 0 ? 'Now' : midnight ? DAYS[dow(h.time.slice(0, 10))] : h.time.slice(11, 13);
      return `
      <div class="hour${midnight ? ' midnight' : ''}" data-date="${h.time.slice(0, 10)}">
        <div class="h-time">${label}</div>
        <div class="h-icon">${wmoEmoji(h.code, h.day)}</div>
        <div class="h-rain ${hourWet(h)}">${h.pop >= 20 ? h.pop + '%' : ''}</div>
        <div class="h-temp">${fmt(h.temp, 0)}°</div>
        ${bpf ? `<div class="h-range">${fmt(h.lo, 0)}–${fmt(h.hi, 0)}</div>` : ''}
      </div>`;
    }).join('');
    strip.scrollLeft = keep;
    renderDayTabs(bpf ? hours : []);
    document.getElementById('rain-key').hidden = !bpf;

    /* Range bars share one scale: the whole week's coldest to hottest, including
       the percentile spread so the shaded band always fits */
    const week = daily.slice(1);
    const N = ['','One','Two','Three','Four','Five','Six','Seven','Eight'];
    document.getElementById('fc-days-h').textContent = `${N[week.length] || week.length}-day forecast`;
    const bandLo = d => d.b ? Math.min(d.lo, d.b.lo10) : d.lo, bandHi = d => d.b ? Math.max(d.hi, d.b.hi90) : d.hi;
    const wLo = Math.min(...week.map(bandLo)), wHi = Math.max(...week.map(bandHi));
    const span = Math.max(1, wHi - wLo), x = t => (t - wLo) / span * 100;
    document.getElementById('fc-days').innerHTML = week.map(d => {
      const pop = d.b?.rain1 ?? d.pop, mm = mmRange(d.b);
      const band = d.b ? `<div class="d-band" style="left:${x(bandLo(d)).toFixed(1)}%;right:${(100 - x(bandHi(d))).toFixed(1)}%"></div>` : '';
      return `
      <div class="day">
        <div class="d-name">${DAYS[dow(d.date)]}</div>
        <div class="d-icon">${wmoEmoji(d.code, true)}</div>
        <div class="d-pop ${dayWet(d.b)}">${pop >= 20 ? `${pop}%` : ''}</div>
        <div class="d-lo">${fmt(d.lo, 0)}°</div>
        <div class="d-track">${band}<div class="d-fill" style="left:${x(d.lo).toFixed(1)}%;right:${(100 - x(d.hi)).toFixed(1)}%;background:linear-gradient(90deg,${tempColor(d.lo)},${tempColor(d.hi)})"></div></div>
        <div class="d-hi">${fmt(d.hi, 0)}°</div>
        <div class="d-quip">${esc(d.quip)}${mm ? ` <span class="d-mm">· ${mm}</span>` : ''}</div>
      </div>`;
    }).join('');

    ph.hidden = pd.hidden = false;
  }

  function renderDayTabs(hours) {
    const tabs = document.getElementById('fc-tabs'), strip = document.getElementById('fc-hours');
    const dates = [...new Set(hours.map(h => h.time.slice(0, 10)))];
    if (dates.length < 2) { tabs.hidden = true; tabs.innerHTML = ''; return; }
    tabs.innerHTML = dates.map((d, i) =>
      `<button class="day-tab" data-date="${d}">${i === 0 ? 'Today' : DAYS[dow(d)]}</button>`).join('');
    tabs.hidden = false;
    tabs.onclick = e => {
      const b = e.target.closest('.day-tab'); if (!b) return;
      const first = strip.querySelector(`.hour[data-date="${b.dataset.date}"]`);
      if (first) strip.scrollTo({ left: first.offsetLeft - strip.offsetLeft - 8, behavior: 'smooth' });
    };
    const mark = () => {
      const edge = strip.scrollLeft + strip.clientWidth / 3;
      let cur = dates[0];
      for (const el of strip.children) { if (el.offsetLeft - strip.offsetLeft > edge) break; cur = el.dataset.date; }
      for (const b of tabs.children) b.classList.toggle('on', b.dataset.date === cur);
    };
    strip.onscroll = mark;
    mark();
  }

  const HUM = [
    [85, ['Close. Swampy bollocks.', 'Muggy as fuck. Air you could drink.', 'Sticky. Like a nightclub floor.']],
    [70, ['Bit clammy.', 'Clammy. Damp pits incoming.', 'Humid-ish. Hair\'s going frizzy, love.']],
    [40, ['Comfortable. Enjoy it.', 'Just right. Goldilocks can fuck off.', 'Fine. Nothing to moan about, sorry.']],
    [0,  ['Dry as a camel\'s arse.', 'Parched. Lips like a Pringle.', 'Desert-dry. Moisturise, you crusty sod.']],
  ];
  const humNote  = h => pick(HUM.find(([min]) => h >= min)[1], 29);
  const PRES = [
    [990,  ['Very low. Batten down the fucking hatches.', 'Deep low. Something nasty\'s brewing.', 'Rock bottom. Storm\'s on its way, mate.']],
    [1005, ['Low. Unsettled, like a pissed uncle.', 'Lowish. Weather\'s in a mood.', 'Low. Expect bollocks.']],
    [1023, ['About normal. Boring.', 'Middling. Nothing to see here.', 'Average. Like your cooking.']],
    [9999, ['High. Settled, for once.', 'High. Calm. Don\'t fucking trust it.', 'High pressure. Smug weather.']],
  ];
  const presNote = p => pick(PRES.find(([max]) => p < max)[1], 31);
  const RAIN_NONE = ['None expected today. Don\'t jinx it.', 'Dry day forecast. Touch fucking wood.',
                     'No rain due. Enjoy it while it lasts, it won\'t.'];
  const clockHM  = iso => iso ? iso.slice(11, 16) : '—';

  /* Met Office warnings. The warning text itself is safety info, so it stays
     verbatim; only the one-line kicker swears. */
  const WARN_KICK = {
    yellow: ['Heads up, you lot.', 'Bit of bother on the way.', 'Mild peril, you soft sods.'],
    amber:  ['Proper shit incoming.', 'This one\'s not fucking about.', 'Serious bollocks. Pay attention.'],
    red:    ['Fucking stay in.', 'Danger to life. Not a fucking joke.', 'Stay home. Seriously. Fuck the plans.'],
    thunder:['Thunder about, you lot.', 'Unplug the fucking telly.', 'Dog under the bed time.'],
  };
  /* Our own alert from the lightning probabilities: 15%+ chance of strikes within
     15 km in the next 48 hours. Sits above the official warnings. */
  const THUNDER_PCT = 15;
  function thunderAlert(bpf, nowTime) {
    if (!bpf) return null;
    const from = (nowTime || '').slice(0, 13);
    const hrs = cols(bpf.hourly).filter(h => h.time.slice(0, 13) >= from).slice(0, 48);
    const peak = hrs.reduce((a, h) => (h.lightning ?? 0) > (a?.lightning ?? -1) ? h : a, null);
    if (!peak || peak.lightning < THUNDER_PCT) return null;
    const when = peak.time.slice(0, 10) === hrs[0].time.slice(0, 10) ? 'today' : DAYSL[dow(peak.time.slice(0, 10))];
    return { level: 'thunder', title: `⚡ ${peak.lightning}% chance of lightning nearby`,
             description: `Peaks around ${hh(peak.time)} ${when}, within 15 km.` };
  }

  function renderWarnings(list, extra) {
    const el = document.getElementById('warnings');
    const all = [...(extra ? [extra] : []), ...(list || [])];
    if (!all.length) { el.hidden = true; el.innerHTML = ''; return; }
    el.innerHTML = all.map(w => {
      const body = `
        <b>${esc(w.title)}</b>
        <p><span class="kicker">${esc(WARN_KICK[w.level] ? pick(WARN_KICK[w.level], 37) : '')}</span> ${esc(w.description)}</p>`;
      return w.link ? `<a class="warn ${esc(w.level)}" href="${esc(w.link)}" target="_blank" rel="noopener">${body}</a>`
                    : `<div class="warn ${esc(w.level)}">${body}</div>`;
    }).join('');
    el.hidden = false;
  }

  /* Use the Met Office forecast when we have a recent one; fall back to Open-Meteo */
  const MO_STALE_S = 3 * 3600;
  const moFresh = mo => mo && mo.current && mo.fetched_at && (Date.now() / 1000 - mo.fetched_at) < MO_STALE_S;
  const bpfFresh = b => b && b.hourly && b.fetched_at && (Date.now() / 1000 - b.fetched_at) < MO_STALE_S;
  const noNulls = o => Object.fromEntries(Object.entries(o || {}).filter(([, v]) => v != null));

  /* Fetch + render */
  let firstRender = true;
  /* History charts: inline SVG, no library. Series are [{name, color, dash?, pts:[[ms,v],...]}] */
  const SVGNS = 'http://www.w3.org/2000/svg';
  function drawChart(svg, series, unit, dec) {
    svg.innerHTML = '';
    const all = series.flatMap(s => s.pts);
    if (!all.length) return;
    const W = svg.clientWidth || 600, H = svg.clientHeight || 200;
    const m = { l: 34, r: 6, t: 8, b: 18 };
    const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
    let y0 = Math.min(...ys), y1 = Math.max(...ys);
    const pad = Math.max((y1 - y0) * 0.1, dec ? 0.5 : 1); y0 -= pad; y1 += pad;
    const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r);
    const Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const el = (n, a, txt) => { const e = document.createElementNS(SVGNS, n);
      for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; };
    for (let i = 0; i <= 3; i++) {
      const v = y0 + (y1 - y0) * i / 3, y = Y(v);
      el('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, class: 'grid' });
      el('text', { x: m.l - 4, y: y + 3, 'text-anchor': 'end' }, v.toFixed(dec));
    }
    /* x labels: midnight ticks over multi-day spans, otherwise every few hours */
    const span = x1 - x0, step = span > 36 * 3600e3 ? 24 * 3600e3 : 6 * 3600e3;
    for (let t = Math.ceil(x0 / step) * step; t <= x1; t += step) {
      const d = new Date(t);
      el('text', { x: X(t), y: H - 4, 'text-anchor': 'middle' },
         step >= 24 * 3600e3 ? d.toLocaleDateString('en-GB', { weekday: 'short' })
                             : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }));
    }
    for (const s of series) {
      if (!s.pts.length) continue;
      /* break the line across gaps (gateway offline) rather than draw through them */
      let d = '', prev = null;
      for (const [t, v] of s.pts) { d += (prev === null || t - prev > (s.gap || 2 * 3600e3) ? 'M' : 'L') + X(t).toFixed(1) + ' ' + Y(v).toFixed(1); prev = t; }
      el('path', { d, fill: 'none', stroke: s.color, 'stroke-width': s.dash ? 1.5 : 2, 'stroke-linejoin': 'round',
                   'stroke-dasharray': s.dash || 'none' });
      const last = s.pts[s.pts.length - 1];   /* dot on the latest point so a short series still shows */
      el('circle', { cx: X(last[0]), cy: Y(last[1]), r: 3, fill: s.color });
    }
  }

  /* Blended forecast: Open-Meteo + Met Office + BPF, corrected against the garden sensor (see forecast_log.blend) */
  async function drawBlend() {
    try {
      const b = await fetch('/api/blend').then(r => r.json());
      const pts = b.hourly.slice(0, 48).map(([t, v]) => [Date.parse(t), v]);
      const panel = document.getElementById('p-blend');
      panel.hidden = pts.length < 2;
      if (pts.length < 2) return;
      const day = pts.slice(0, 24).map(p => p[1]);
      document.getElementById('blend-sum').textContent =
        `Next 24 hours: ${Math.round(Math.min(...day))}° to ${Math.round(Math.max(...day))}°`;
      drawChart(document.getElementById('blend-temp'), [{ name: 'Blend', color: '#ffd21f', pts, gap: 2 * 3600e3 }], '°C', 1);
      const n = Math.min(...Object.values(b.weights).map(w => w.n));
      document.getElementById('blend-note').textContent = n < 48
        ? `Still learning from the garden sensor (${n} of 48 hours), so sources are weighted equally for now.`
        : 'Sources are weighted by how closely each has matched the garden sensor.';
    } catch (e) { console.warn('blend failed', e); }
  }
  drawBlend(); setInterval(drawBlend, 600000);

  let histHours = 72;
  async function drawHistory() {
    try {
      const h = await fetch('/api/history?hours=' + histHours).then(r => r.json());
      const col = i => h.garden.filter(r => r[i] != null).map(r => [r[0], r[i]]);
      const temp = [
        { name: 'Garden',   color: '#ffd21f', pts: col(1), gap: 3600e3 },
        { name: 'Shed',     color: '#ff8a65', pts: col(3), gap: 3600e3 },
        { name: 'Forecast', color: '#ffffff', dash: '4 3', pts: h.forecast },
      ].filter(s => s.pts.length);
      drawChart(document.getElementById('hist-temp'), temp, '°C', 1);
      document.getElementById('hist-key').innerHTML = temp.map(s =>
        `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');
      drawChart(document.getElementById('hist-pres'), [{ name: 'Pressure', color: '#8fd0ff', pts: col(5), gap: 3600e3 }], 'hPa', 0);
      document.getElementById('hist-note').textContent = h.garden.length < 2
        ? 'Garden and Shed logging started 6 Oct, so there is not much to see yet.'
        : 'Forecast is the latest Open-Meteo run made before each hour.';
    } catch (e) { console.warn('history failed', e); }
  }
  document.getElementById('hist-tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    histHours = +b.dataset.h;
    document.querySelectorAll('#hist-tabs button').forEach(x => x.classList.toggle('on', x === b));
    drawHistory();
  });
  drawHistory(); setInterval(drawHistory, 600000);
  window.addEventListener('resize', () => { clearTimeout(drawHistory.t); drawHistory.t = setTimeout(() => { drawHistory(); drawBlend(); }, 250); });

  async function refresh() {
    try {
      const j = await fetch('/api/weather').then(r => r.json());
      if (j.error && !j.data) { document.getElementById('condition').textContent = 'Error: ' + j.error; return; }
      const mo  = moFresh(j.metoffice) ? j.metoffice : null;
      /* Met Office values override Open-Meteo field by field; anything it lacks
         (e.g. is_day) comes from Open-Meteo */
      const d = { ...j.data, ...noNulls(mo?.current) };
      const bpf = bpfFresh(j.bpf) ? j.bpf : null;
      renderWarnings(j.warnings, thunderAlert(bpf, d.time));

      /* Garden sensor (Ecowitt) overrides the model's temperature and humidity while its
         reading is under 30 min old; otherwise fall back to Open-Meteo. */
      const gd = j.garden && (Date.now() / 1000 - j.garden.time) < 1800 ? j.garden : null;
      const gTemp = gd?.garden?.temp ?? null, gHum = gd?.garden?.humidity ?? null;

      const code = d.weather_code ?? 0;
      const day  = !!d.is_day;
      applyTheme(wmoCondition(code), day);
      document.getElementById('wx-ghost').textContent = wmoEmoji(code, day);

      renderForecast(mo || j.forecast, d.time, code, bpf);

      document.getElementById('location').textContent   = d.location_name || 'Weather';
      document.getElementById('temp').textContent       = fmt(gTemp ?? d.temperature_2m, 0);
      document.getElementById('cond-plain').textContent = d.description || '';
      document.getElementById('hilo').innerHTML = today
        ? `<span>H ${fmt(today.hi, 0)}°</span><span>L ${fmt(today.lo, 0)}°</span>` : '';

      document.getElementById('condition').textContent = swearyCond(code, d.description || '');
      document.getElementById('feels').textContent = d.apparent_temperature != null
        ? `Feels like ${fmt(d.apparent_temperature, 0)}°. ${swearyFeels(d.apparent_temperature)}` : '';
      if (firstRender) { document.getElementById('caption').classList.add('wipe'); firstRender = false; }

      /* Wind */
      const spd = d.wind_speed_10m, dir = d.wind_direction_10m, gust = d.wind_gusts_10m;
      document.getElementById('wind-speed').innerHTML = `${fmt(spd, 0)}<small>mph</small>`;
      document.getElementById('wind-dir').textContent = dir != null ? `From the ${compass(dir)}` : '';
      document.getElementById('wind-gust').textContent = gust != null
        ? `Gusts ${fmt(gust, 0)} mph` + (swearyGust(gust) ? `, ${swearyGust(gust)}` : '') : '';
      if (dir != null)
        document.getElementById('compass-needle').setAttribute('transform', `rotate(${dir},60,60)`);
      setWindLines((gust ?? spd ?? 0) >= 22);

      /* Humidity */
      const hum = gHum ?? d.relative_humidity_2m;
      document.getElementById('humidity').textContent = hum != null ? `${fmt(hum, 0)}%` : '—';
      document.getElementById('hum-note').textContent = hum != null ? humNote(hum) : '';
      if (hum != null)
        document.getElementById('hum-ring').style.strokeDasharray = `${(hum / 100) * 263.9} 263.9`;

      /* UV */
      const uv = d.uv_index != null ? Math.round(d.uv_index * 10) / 10 : null;
      document.getElementById('uv').textContent       = uv ?? '—';
      document.getElementById('uv-label').textContent = uv != null ? swearyUv(uv) : '';
      document.getElementById('uv-dot').style.left    = `${Math.min(100, (uv ?? 0) / 11 * 100)}%`;

      /* Rain */
      document.getElementById('rain').innerHTML = `${fmt(d.rain, 1)}<small>mm</small>`;
      document.getElementById('rain-today').textContent = today && today.rain != null
        ? (today.rain < 0.1 ? pick(RAIN_NONE, 41) : `${fmt(today.rain, 1)} mm expected today.` + (today.rain >= 10 ? ' Absolute soaking.' : '')) : '';

      /* Sun: show whichever event comes next */
      if (today && today.sunset) {
        const nowIso = d.time || '';
        const beforeRise = nowIso < today.sunrise, beforeSet = nowIso < today.sunset;
        const [label, next, other] = beforeRise ? ['Sunrise', today.sunrise, `Sunset ${clockHM(today.sunset)}`]
          : beforeSet ? ['Sunset', today.sunset, `Sunrise was ${clockHM(today.sunrise)}`]
          : ['Sunrise', today.tomorrowSunrise, `Sunset was ${clockHM(today.sunset)}`];
        document.getElementById('sun-label').textContent = label;
        document.getElementById('sun-next').textContent  = clockHM(next);
        document.getElementById('sun-other').textContent = other;
      }

      /* Pressure */
      document.getElementById('pressure').innerHTML = `${fmt(d.surface_pressure, 0)}<small>hPa</small>`;
      document.getElementById('pres-note').textContent = d.surface_pressure != null ? presNote(d.surface_pressure) : '';

      /* Garden (outdoor WN32) and Shed (the gateway's own sensor), from the Ecowitt GW1200A.
         Blank rather than stale if the poll has been failing for over 30 min. */
      const sensor = (id, o, note) => {
        document.getElementById(id + '-temp').innerHTML = o && o.temp != null ? `${fmt(o.temp, 1)}<small>°C</small>` : '—';
        document.getElementById(id + '-hum').textContent = o && o.humidity != null ? `${fmt(o.humidity, 0)}% humidity` : '';
        document.getElementById(id + '-note').textContent = o ? note(o) : 'No reading';
      };
      sensor('garden', gd?.garden, o => o.dewpoint != null ? `Dew point ${fmt(o.dewpoint, 1)}°` : '');
      sensor('shed', gd?.shed, () => gd.pressure != null ? `${fmt(gd.pressure, 0)} hPa` : '');

      const when = j.fetched_at ? new Date(j.fetched_at * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '—';
      document.getElementById('updated').textContent = mo
        ? `Met Office forecast, updated ${new Date(mo.fetched_at * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}. Sunrise/sunset from Open-Meteo.` + (bpf ? ' Ranges and rain odds from the Met Office blended probabilistic forecast.' : '')
        : `Updated ${when} from Open-Meteo`;
    } catch (e) {
      document.getElementById('condition').textContent = 'Weather server\'s fucked off somewhere. Retrying in five minutes.';
    }
  }

  refresh();
  setInterval(refresh, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
